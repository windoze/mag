[workspace]
members = [
    "crates/mag",
    "crates/mag-acp",
    "crates/mag-cli",
    "crates/mag-config",
    "crates/mag-core",
    "crates/mag-web",
    "crates/mag-service",
    "crates/mag-sources",
    "crates/mag-tools",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agent-lib = { path = "../agent-lib" }
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of the archived `serde_yaml`. Pinned below 0.0.13, which is a
# deprecated shim forwarding to `noyalib` rather than the serde_yaml lineage.
serde_yml = "0.0.12"
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = "0.8"
tokio-stream = "0.1"
tower = "0.5"
ts-rs = "12"
uuid = { version = "1", features = ["serde"] }
rust-embed = "8"
