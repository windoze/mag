[package]
name = "mag"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mag"
path = "src/main.rs"

[dependencies]
mag-acp = { path = "../mag-acp" }
mag-cli = { path = "../mag-cli" }
mag-core = { path = "../mag-core" }
mag-service = { path = "../mag-service" }
agent-client-protocol = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
agent-lib = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
mag-tools = { path = "../mag-tools" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
